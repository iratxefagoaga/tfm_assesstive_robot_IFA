[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm-memory"
version = "0.1.0"
description = "Semantic memory backend for the TFM"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["memory", "memory.embedding", "memory.retrieval"]
package-dir = {"memory" = "."}
